name: Build and Upload APK
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      # 1️⃣ Depoyu klonla
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Flutter kurulumunu yap
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'  # kendi versiyonuna göre düzenleyebilirsin

      # 3️⃣ Bağımlılıkları al
      - name: Get dependencies
        run: flutter pub get

      # 4️⃣ Build işlemini çalıştır
      - name: Build release APK
        run: flutter build apk --release

      # 5️⃣ Build klasöründeki dosyaları listele (kontrol amaçlı)
      - name: List build outputs
        run: ls -R build/app/outputs

      # 6️⃣ Üretilen APK'yı Artifact olarak yükle
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 7️⃣ Log bilgileri (opsiyonel)
      - name: Show Supabase info
        run: |
          echo "Supabase URL: $SUPABASE_URL"
          echo "Build completed successfully ✅"
